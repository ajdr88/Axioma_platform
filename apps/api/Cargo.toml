[package]
name = "api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alf-lite = { path = "../../packages/alf-lite" }
cem-core = { path = "../../packages/cem-core" }
sysml-core = { path = "../../packages/sysml-core" }
sysml-textual = { path = "../../packages/sysml-textual" }

axum = { version = "0.7", features = ["multipart"] }
tokio = { workspace = true }
tower-http = { version = "0.6", features = ["trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = "1"
dotenvy = "0.15"

# Store adapters (ADR-003 polyglot persistence).
neo4rs = "0.8"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "json",
] }
aws-sdk-s3 = "1"
aws-config = "1"

# ReqIF import (§ import/reqif.rs) — read-only DOM, a better fit than a serde struct tree for
# ReqIF's deeply-optional nested schema.
roxmltree = "0.21"

# Server-generated ids for canvas-created elements (POST /api/v0/elements).
uuid = { version = "1", features = ["v4"] }

# NFR-COMP-03 auth abstraction (apps/api/src/auth.rs) — Bearer-JWT validation for
# `OidcAuthProvider`. No OIDC-discovery/JWKS crate needed yet (see that module's doc comment on
# scope): a single configured HMAC secret, not a live IdP's rotating keys.
jsonwebtoken = "9"

# Mode A grounded-copilot slice (apps/api/src/mode_a.rs) — a local Ollama call, no llm-gateway
# package yet (ADR-004, deliberately deferred until a second consumer needs the abstraction).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"

# P1.4 (roadmap: Behavioral Simulation, ADR-005/008) — the gRPC client to the fuml-runtime JVM
# sidecar. No dedicated Rust workspace crate for this (one caller, same "thin slice, no
# premature package" reasoning already applied to Mode A/llm-gateway) — apps/api/build.rs
# compiles the same proto/fuml_runtime.proto fuml-runtime's own build.sh does.
tonic = "0.12"
prost = "0.13"

# docs/IMPLEMENTATION_KICKOFF.md Phase 5 (FR-CORE-14, documents -> draft model pipeline) — real
# per-page text extraction from an in-memory PDF (`extract_text_from_mem_by_pages`, verified
# directly against docs.rs before adding). Text-layer extraction only, no OCR (see
# `document_import.rs`'s own doc comment for the deliberate scope-down).
pdf-extract = "0.12"
# Scope-downs pass (FR-EXPORT-02, XLSX) — verified directly against docs.rs before adding: pure
# Rust by default (its only default dependency is `zip`; a C toolchain is only pulled in by the
# optional `zlib` perf feature, which this workspace does not enable).
rust_xlsxwriter = "0.99"

# Pending-items Tier 1 item 10 (0D physics-model evaluator, apps/api/src/parametrics.rs) — a real
# embedded arithmetic-expression engine so a Model's governing relations are formula strings, not
# hardcoded Rust per-relation functions. Chosen over `evalexpr` (relicensed AGPL-3.0-only as of
# v12, disqualifying for this workspace's MIT/BSD discipline) and `fasteval`/`meval` (both stale,
# last released 2020/2018). MIT OR Apache-2.0, actively maintained, and its
# `eval_expression_with_scope::<f64>()` mode plus `Engine::set_max_operations`/
# `set_max_expr_depths` give real, first-party safety guards for a formula string that is
# effectively untrusted seed/user-authored input — confirmed via research before adding, not
# assumed.
rhai = "1.26.0"

# Scope-downs pass (FR-CORE-14, OCR) — real, `optional = true`, gated behind the `ocr` feature
# (default off). `leptess` (Tesseract binding) needs `libtesseract-dev`/`libleptonica-dev`/
# `clang` present at COMPILE time (a real `-sys` crate) — this dev machine is Windows, and the
# default workspace build must keep working here and for every other contributor without those
# installed. `pdfium-render` itself only *dynamically* binds a Pdfium `.so` at runtime
# (`Pdfium::bind_to_library`, verified against its own docs — ships no binary itself), but is
# gated the same way for consistency, since it's only ever used alongside `leptess`. See
# `apps/api/Dockerfile` for the one place `--features ocr` is actually built, and
# `document_import.rs`'s own doc comment for the `#[cfg(feature = "ocr")]` split.
pdfium-render = { version = "0.9", optional = true }
leptess = { version = "0.14", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[features]
ocr = ["dep:pdfium-render", "dep:leptess", "dep:image"]

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
http-body-util = "0.1"
