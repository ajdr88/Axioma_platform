[package]
name = "api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sysml-core = { path = "../../packages/sysml-core" }
sysml-textual = { path = "../../packages/sysml-textual" }

axum = "0.7"
tokio = { workspace = true }
tower-http = { version = "0.6", features = ["trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = "1"
dotenvy = "0.15"

# Store adapters (ADR-003 polyglot persistence).
neo4rs = "0.8"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "json",
] }
aws-sdk-s3 = "1"
aws-config = "1"

# ReqIF import (§ import/reqif.rs) — read-only DOM, a better fit than a serde struct tree for
# ReqIF's deeply-optional nested schema.
roxmltree = "0.21"

# Server-generated ids for canvas-created elements (POST /api/v0/elements).
uuid = { version = "1", features = ["v4"] }

# Mode A grounded-copilot slice (apps/api/src/mode_a.rs) — a local Ollama call, no llm-gateway
# package yet (ADR-004, deliberately deferred until a second consumer needs the abstraction).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"

[dev-dependencies]
http-body-util = "0.1"
