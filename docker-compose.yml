name: axioma

services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/axioma-dev
      NEO4J_PLUGINS: '["graph-data-science"]'
    ports:
      - "7474:7474" # browser
      - "7687:7687" # bolt
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: axioma
      POSTGRES_PASSWORD: axioma-dev
      POSTGRES_DB: axioma
    ports:
      - "5433:5432" # host 5433 to avoid clashing with a locally-installed Postgres on 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axioma"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: axioma
      MINIO_ROOT_PASSWORD: axioma-dev
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Mode A's grounded-copilot slice (ADR-004: local-first LLM) — apps/api calls this directly
  # over plain HTTP (no llm-gateway package yet, see packages/llm-gateway/README.md).
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # P1.4's Behavioral Simulation sidecar (ADR-005/008) — the real fUML Reference Implementation,
  # driven from apps/api over gRPC. This pass supports exactly one fixed activity ("HelloWorld2");
  # no health check yet since the sidecar doesn't register gRPC's health-check service this pass
  # (deferred alongside alf-lite/the pilot's real State Machine — see packages/fuml-runtime/README.md).
  fuml-runtime:
    build: ./packages/fuml-runtime
    ports:
      - "50051:50051"

  # docs/IMPLEMENTATION_KICKOFF.md Phase 2 spike (ADR-011) — a Python sidecar wrapping
  # adsg-core/SBArchOpt for Mode B's architecture design-space representation, driven from
  # apps/api over gRPC. Same "no health check yet" gap as fuml-runtime above, for the same reason
  # (no gRPC health-check service registered anywhere in this repo yet) — see
  # packages/cem-archspace/README.md for what this spike proved and what's still open.
  cem-archspace:
    build: ./packages/cem-archspace
    ports:
      - "50052:50052"

  # Scope-downs pass (FR-CORE-14, OCR) — the first time `apps/api` itself runs containerized.
  # Built with `--features ocr` (see apps/api/Dockerfile's own comment) specifically so OCR can
  # be exercised without every contributor needing Tesseract/Pdfium installed on their host —
  # normal dev keeps using `cargo run -p api` on the host, unaffected, default features only.
  # Not started by a bare `docker compose up -d` unless explicitly named (`docker compose up -d
  # api`) or built (`docker compose build api`) — every other service above predates this and
  # is unaffected either way.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8081:8080" # host 8081, not 8080 -- avoids clashing with `cargo run -p api` on the host
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: axioma-dev
      DATABASE_URL: postgres://axioma:axioma-dev@postgres:5432/axioma
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: axioma
      S3_SECRET_KEY: axioma-dev
      S3_BUCKET: axioma-geometry
      OLLAMA_URL: http://ollama:11434
      FUML_RUNTIME_ADDR: http://fuml-runtime:50051
      ARCHSPACE_ADDR: http://cem-archspace:50052
    depends_on:
      - neo4j
      - postgres
      - minio
      - ollama

volumes:
  neo4j-data:
  postgres-data:
  minio-data:
  ollama-data:

# Intentionally not included yet: Vault (secrets) and `collab` (CRDT server) — these join the
# stack when auth (AX-104) and real-time collaboration (FR-CORE-06) work actually starts, per
# docs/Axioma_implementation_v3.md §3.2.
