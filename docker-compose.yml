name: axioma

services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/axioma-dev
      NEO4J_PLUGINS: '["graph-data-science"]'
    ports:
      - "7474:7474" # browser
      - "7687:7687" # bolt
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: axioma
      POSTGRES_PASSWORD: axioma-dev
      POSTGRES_DB: axioma
    ports:
      - "5433:5432" # host 5433 to avoid clashing with a locally-installed Postgres on 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axioma"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: axioma
      MINIO_ROOT_PASSWORD: axioma-dev
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  neo4j-data:
  postgres-data:
  minio-data:

# Intentionally not included yet: Vault (secrets) and `collab` (CRDT server) — these join the
# stack when auth (AX-104) and real-time collaboration (FR-CORE-06) work actually starts, per
# docs/Axioma_implementation_v3.md §3.2.
